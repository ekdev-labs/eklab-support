name: Feature request
description: Explain a use case that Eklab does not currently address.
title: '[Feature] '
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: This request will be public. Use synthetic examples and do not include confidential material. Requests do not imply a delivery commitment.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user need and relevant integration or component.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds considered
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing requests and removed confidential information.
          required: true
