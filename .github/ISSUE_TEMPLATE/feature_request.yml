name: Feature request
description: Suggest an improvement to an existing Eklab capability or documentation.
title: '[Feature] '
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        For a new component, use the Component request form instead.
        Search existing requests first and add a 👍 reaction to the opening post of a matching request instead of creating a duplicate.
        This request will be public. Use synthetic examples and do not include confidential material. Requests do not imply a delivery commitment.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user need and relevant integration or component.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds considered
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing requests and removed confidential information.
          required: true
